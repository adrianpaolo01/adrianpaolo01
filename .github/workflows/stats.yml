name: Generate stats card

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main
    paths:
      - '.github/workflows/stats.yml'

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate stats.svg
        env:
          STATS_USERNAME: ${{ github.repository_owner }}
        run: |
          mkdir -p dist
          # Fetch public profile statistics without the repository-scoped token.
          curl --fail --silent --show-error --location --retry 3 --get \
            --data-urlencode "username=$STATS_USERNAME" \
            --data-urlencode "hide_title=false" \
            --data-urlencode "hide_rank=false" \
            --data-urlencode "show_icons=true" \
            --data-urlencode "include_all_commits=true" \
            --data-urlencode "disable_animations=false" \
            --data-urlencode "theme=codeSTACKr" \
            --data-urlencode "locale=en" \
            --data-urlencode "hide_border=false" \
            "https://github-readme-stats.vercel.app/api" \
            --output dist/stats.svg
          # Error cards also return HTTP 200: keep the last valid card on failure.
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("dist/stats.svg").getroot()
          assert root.tag == "{http://www.w3.org/2000/svg}svg", "Expected an SVG card"
          assert any(node.get("data-testid") == "commits" for node in root.iter()), "Missing statistics"
          assert 'data-testid="message"' not in open("dist/stats.svg").read(), "Stats service returned an error card"
          PY


      - name: push stats.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: stats-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
